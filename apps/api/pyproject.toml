[project]
name = "schoolos-api"
version = "0.1.0"
description = "SchoolOS — multi-tenant school management platform (Phase 1: core academic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg2-binary>=2.9",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "nh3>=0.2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"