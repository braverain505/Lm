# SchoolOS production reverse proxy. Serves the Next.js app on :80, routes
# /api/* to the FastAPI service. Cookies are httpOnly + Secure; the browser
# never talks to anything but nginx (single origin, no CORS).
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;
  gzip            on;

  upstream api_upstream {
    server api:8000;
    keepalive 16;
  }

  upstream web_upstream {
    server web:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API — no HTML caching; the API sets its own auth cookies.
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web app (Next.js). Docs/static are cached by the client, not here.
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
    }
  }
}